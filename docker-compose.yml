version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: comparia-postgres
    environment:
      POSTGRES_DB: comparia_search
      POSTGRES_USER: comparia_user
      POSTGRES_PASSWORD: comparia_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comparia_user -d comparia_search']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: comparia-adminer
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:

networks:
  default:
    name: comparia-network
